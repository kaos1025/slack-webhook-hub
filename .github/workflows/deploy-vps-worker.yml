name: Deploy VPS Worker

on:
  push:
    branches:
      - phase1-slack-events
  workflow_dispatch:

concurrency:
  group: deploy-vps-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install SSH key and trust VPS host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/agent_relay_deploy_key
          chmod 600 ~/.ssh/agent_relay_deploy_key
          touch ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -p "$VPS_PORT" -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts; then
              break
            fi
            echo "ssh-keyscan failed on attempt ${attempt}; retrying..." >&2
            sleep 3
          done
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy worker repo
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_REF: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/agent_relay_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "DEPLOY_REF='$DEPLOY_REF' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /srv/slack-webhook-hub
          git fetch origin phase1-slack-events
          git checkout phase1-slack-events
          git reset --hard "$DEPLOY_REF"
          npm ci
          npm run verify:dashboard
          npm run lint
          if systemctl list-unit-files agent-relay-scheduler.timer >/dev/null 2>&1; then
            if systemctl is-enabled --quiet agent-relay-scheduler.timer || systemctl is-active --quiet agent-relay-scheduler.timer; then
              sudo systemctl restart agent-relay-scheduler.timer
            fi
          fi
          git status --short --branch
          REMOTE
